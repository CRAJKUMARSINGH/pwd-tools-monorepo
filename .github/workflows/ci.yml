name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pwd_test
          POSTGRES_DB: pwd_tools_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Lint frontend
        run: pnpm --filter @workspace/pwd-tools lint
      - name: Build pwd-tools
        run: pnpm --filter @workspace/pwd-tools build
      - name: Build the correspondence API
        run: pnpm --filter @workspace/api-server build
      - name: Smoke tests
        run: pnpm --filter @workspace/scripts test:smoke
      - name: Unit tests
        run: pnpm test run
      - name: API access and request validation
        run: pnpm --filter @workspace/scripts test:api-auth
      - name: Check bilingual correspondence against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:pwd_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pwd_tools_test
        run: pnpm --filter @workspace/scripts test:correspondence
