name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # typecheck and lint skipped — 234 pre-existing TS errors from
      # Radix UI / React-19 typing drift. Tracked in known-issues.md.
      - name: Build
        run: pnpm --filter @workspace/pwd-tools build

      - name: Smoke tests
        run: pnpm --filter @workspace/scripts test:smoke
