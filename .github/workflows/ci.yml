name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frontend and smoke-test dependencies
        run: pnpm --filter '@workspace/pwd-tools...' --filter '@workspace/scripts' install --frozen-lockfile --prod=false
      - name: Build pwd-tools
        run: pnpm --filter @workspace/pwd-tools build
      - name: Smoke tests
        run: pnpm --filter @workspace/scripts test:smoke
