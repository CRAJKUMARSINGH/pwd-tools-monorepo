<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delay Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .calculator {
            border: 2px solid #ff00ff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            background-color: white;
            max-width: 400px;
            width: 100%;
        }

        h2 {
            color: #ff00ff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ff00ff;
            font-weight: bold;
        }

        .input-group input[type="date"] {
            padding: 10px;
            border: 1px solid #ff00ff;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #ff00ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e600e6;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 5px;
            background-color: #fff0f5;
            border-left: 4px solid #ff00ff;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Delay Calculator</h2>

        <div class="input-group">
            <label for="scheduledStart">Scheduled Start Date (dd/mm/yyyy):</label>
            <input type="date" id="scheduledStart">
        </div>

        <div class="input-group">
            <label for="scheduledCompletion">Scheduled Completion Date (dd/mm/yyyy):</label>
            <input type="date" id="scheduledCompletion">
        </div>

        <div class="input-group">
            <label for="actualCompletion">Actual Completion Date (dd/mm/yyyy):</label>
            <input type="date" id="actualCompletion">
        </div>

        <button data-action="calculate">Calculate Delay</button>

        <div id="result"></div>
    </div>

    <script src="./DelayCalculator.js"></script>
</body>
</html>
