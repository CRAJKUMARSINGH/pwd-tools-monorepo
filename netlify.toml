[build]
  # dist/public is pre-built and committed (see .gitignore) and Netlify serves
  # it directly. Keeping the build step empty makes deploys deterministic: a
  # server-side pnpm/vite build that fails silently freezes the deploy on the
  # last successful one. To ship a change, rebuild dist locally and commit it.
  base    = "."
  command = ""
  publish = "artifacts/pwd-tools/dist/public"

[build.environment]
  NODE_ENV = "production"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# browser-image-compression runs with useWebWorker: true, so the worker does
# importScripts() against cdn.jsdelivr.net. Drop jsdelivr from script-src or
# worker-src and the import is blocked, compression silently falls back to the
# main thread, and the UI freezes on large photos with no error shown.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=(self) is required for the image tool's device-GPS button;
    # without it the browser silently denies getCurrentPosition.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
